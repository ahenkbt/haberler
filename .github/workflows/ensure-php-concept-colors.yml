# Neon + PHP twilight-pine: konsept hmPrimaryColor/hmSecondaryColor kilidi.
name: ensure-php-concept-colors

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ensure-php-concept-colors]

concurrency:
  group: ensure-php-concept-colors
  cancel-in-progress: true

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: DATABASE_URL
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: goalgo/pnpm-lock.yaml

      - name: Install goalgo dependencies
        working-directory: goalgo
        run: pnpm install --frozen-lockfile

      - name: Ensure concept colors
        working-directory: goalgo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL || '' }}
          NEWS_DB_READ: ${{ secrets.NEWS_DB_READ || 'news' }}
          NEWS_DB_WRITE: dual
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret missing — cannot patch PHP concept colors in Neon."
            exit 1
          fi
          if [ -z "${NEWS_DATABASE_URL:-}" ]; then
            echo "::warning::NEWS_DATABASE_URL missing — PHP twilight-pine may stay out of sync."
          fi
          pnpm --filter @workspace/api-server run ensure:php-concept-colors
