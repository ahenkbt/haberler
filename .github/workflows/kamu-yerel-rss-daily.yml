# Günlük Cumha RSS → turkatahaber.com & yerel.net.tr + ağ senkronu + PHP Neon.
# Kampanyalar Neon rss_campaigns içinde `kamu-yerel-cumha` etiketiyle bulunur (prod ör. id 1021/1022).
# Secrets: DATABASE_URL (+ NEWS_DATABASE_URL dual-write / PHP sync)
name: Kamu yerel Cumha RSS daily

on:
  schedule:
    # 06:00 UTC = 09:00 Europe/Istanbul (portal RSS kalıcı kayıt slotu ile hizalı)
    - cron: "0 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [kamu-yerel-rss-daily]

concurrency:
  group: kamu-yerel-rss-daily
  cancel-in-progress: false

jobs:
  ingest-syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: DATABASE_URL
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: goalgo/pnpm-lock.yaml

      - name: Install goalgo dependencies
        working-directory: goalgo
        run: pnpm install --frozen-lockfile

      # 2026-10-08: ensure:kamu-yerel removed from the daily run; it rewrote turkatahaber/yerel layouts
      # (logos, menus, Daha). Site setup is a manual one-off (workflow ensure-kamu-yerel.yml).
      - name: run:kamu-yerel-rss-daily
        working-directory: goalgo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL || '' }}
          NEWS_DB_READ: ${{ secrets.NEWS_DB_READ || 'news' }}
          NEWS_DB_WRITE: dual
          SKIP_ENSURE: "1"
        run: |
          set -euo pipefail
          pnpm --filter @workspace/api-server run run:kamu-yerel-rss-daily
