# Neon: ASG Ankara kategori + rss-{id} slug onarımı (PR #415 sonrası prod).
# Secrets: DATABASE_URL (GitHub Environment: DATABASE_URL)
name: Repair ASG Ankara RSS

on:
  workflow_run:
    workflows: ["Cloudflare Production Deploy"]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [repair-asg-ankara-rss]
  workflow_dispatch:
    inputs:
      slugs:
        description: "Virgülle ayrılmış rss slug listesi (boş = tüm rss-\\d+ + Ankara yeniden sınıflandırma)"
        required: false
        default: "rss-340482,rss-340313,rss-340312,rss-340052,rss-339918,rss-339832,rss-339539,rss-339451,rss-338735,rss-339059,rss-337969,rss-337933,rss-337940,rss-337815,rss-337817,rss-341569,rss-342598"
      dry_run:
        description: "Yalnızca dry-run (true/false)"
        required: false
        default: "false"

concurrency:
  group: repair-asg-ankara-rss
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: DATABASE_URL
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: goalgo/pnpm-lock.yaml

      - name: Install goalgo dependencies
        working-directory: goalgo
        run: pnpm install --frozen-lockfile

      - name: repair:asg-ankara-rss
        working-directory: goalgo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL || '' }}
          NEWS_DB_WRITE: dual
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '16f5b996194174624e7969a3658bd2bb' }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret missing — cannot repair ASG in Neon."
            exit 1
          fi
          if [ -z "${NEWS_DATABASE_URL:-}" ]; then
            echo "::warning::NEWS_DATABASE_URL missing — PHP twilight-pine may stay out of sync after repair."
          fi
          SLUGS=""
          DRY="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLUGS="${{ github.event.inputs.slugs }}"
            DRY="${{ github.event.inputs.dry_run }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            SLUGS="${{ github.event.client_payload.slugs || '' }}"
            DRY="${{ github.event.client_payload.dry_run || 'false' }}"
          fi
          SLUG_ARGS=()
          if [ -n "$SLUGS" ]; then
            SLUG_ARGS=(--slugs="$SLUGS")
          fi
          if [ "$DRY" = "true" ]; then
            pnpm --filter @workspace/api-server run repair:asg-ankara-rss -- --dry-run "${SLUG_ARGS[@]}"
          else
            pnpm --filter @workspace/api-server run repair:asg-ankara-rss -- --apply "${SLUG_ARGS[@]}"
          fi
