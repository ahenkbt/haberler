# Neon seed: turkatahaber.com & yerel.net.tr — Cumha kamu-yerel categories, RSS campaigns, layout.
# Requires merged ensure:kamu-yerel script (see goalgo/artifacts/api-server/scripts/ensure-kamu-yerel-sites.ts).
# Secrets: DATABASE_URL (Neon haber DB — same as cloudflare-production.yml)
name: Ensure Kamu Yerel Neon seed

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ensure-kamu-yerel]

concurrency:
  group: ensure-kamu-yerel
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: DATABASE_URL
    steps:
      - uses: actions/checkout@v6
        with:
          # repository_dispatch: pass client_payload.ref to run a feature branch catalog.
          ref: ${{ github.event.client_payload.ref || github.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: goalgo/pnpm-lock.yaml

      - name: Install goalgo dependencies
        working-directory: goalgo
        run: pnpm install --frozen-lockfile

      - name: ensure:kamu-yerel
        working-directory: goalgo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEWS_DATABASE_URL: ${{ secrets.NEWS_DATABASE_URL || '' }}
          # Prefer panel Neon (main) so dual-write updates Worker site ids; PHP sync resolves by slug.
          NEWS_DB_READ: ${{ secrets.NEWS_DB_READ || 'main' }}
          NEWS_DB_WRITE: dual
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret missing — cannot seed turkatahaber.com / yerel.net.tr in Neon."
            echo "Manual: cd goalgo && DATABASE_URL='postgresql://…@….neon.tech/neondb?sslmode=require' pnpm --filter @workspace/api-server run ensure:kamu-yerel"
            exit 1
          fi
          if [ -z "$NEWS_DATABASE_URL" ]; then
            echo "::warning::NEWS_DATABASE_URL missing — PHP twilight-pine may stay empty; set secret for dual-write."
          fi
          echo "checkout_ref=${{ github.event.client_payload.ref || github.ref }}"
          SYNC_PHP_LAYOUT="${{ github.event.client_payload.sync_php_layout || '1' }}"
          export SYNC_PHP_LAYOUT
          RUN_RSS_CAMPAIGN="${{ github.event.client_payload.run_rss_campaign || '0' }}"
          export RUN_RSS_CAMPAIGN
          pnpm --filter @workspace/api-server run ensure:kamu-yerel
