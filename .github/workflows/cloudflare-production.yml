# Cloudflare Workers + Containers (API) + Neon Postgres
# Secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   DATABASE_URL          (Neon connection string)
#   SESSION_SECRET        (min 16 chars)
# Optional: AGENTLABS_URL, S3_* (R2), HM_EDITOR_JWT_SECRET, ADMIN_MAINTENANCE_SECRET
name: Cloudflare Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - "goalgo/artifacts/ahenkpress/**"
      - "goalgo/artifacts/yektube-web/**"
      - "goalgo/artifacts/api-server/**"
      - "goalgo/lib/**"
      - "goalgo/Dockerfile.cloudflare"
      - "goalgo/scripts/copy-yektube-build.mjs"
      - "goalgo/scripts/cloudflare-build.mjs"
      - "goalgo/scripts/write-netlify-redirects.mjs"
      - "goalgo/scripts/generate-public-sitemap.mjs"
      - "goalgo/scripts/resolve-api-origin.mjs"
      - "scripts/cloudflare-root-build.mjs"
      - "scripts/ensure-yektube-cloudflare-assets.mjs"
      - "cloudflare/**"
      - "wrangler.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/cloudflare-production.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: DATABASE_URL
    steps:
      - uses: actions/checkout@v6

      - name: Check Cloudflare + Neon secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy (CLOUDFLARE_API_TOKEN missing)."
            exit 0
          fi
          # ACCOUNT_ID wrangler.toml / cf-fix ile aynı varsayılan
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ACCOUNT_ID=16f5b996194174624e7969a3658bd2bb" >> "$GITHUB_ENV"
          else
            echo "ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          fi
          # Neon secrets isteğe bağlı — SPA Assets + Worker deploy için token yeterli
          if [ -z "$DATABASE_URL" ] || [ -z "$SESSION_SECRET" ]; then
            echo "sync_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL / SESSION_SECRET yok — Worker secret sync atlanacak, SPA deploy devam."
          else
            echo "sync_secrets=true" >> "$GITHUB_OUTPUT"
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.cf.outputs.enabled == 'true'
        with:
          version: 9.15.5

      - name: Set up Docker Buildx (API Container)
        if: steps.cf.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v6
        if: steps.cf.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            goalgo/pnpm-lock.yaml

      - name: Install root deps (wrangler / containers)
        if: steps.cf.outputs.enabled == 'true'
        run: pnpm install

      - name: Build SPA
        if: steps.cf.outputs.enabled == 'true'
        env:
          # Same-origin: boş API_ORIGIN → Worker Container /api
          API_ORIGIN: ""
          NPM_CONFIG_PRODUCTION: "false"
          AGENTLABS_URL: ${{ secrets.AGENTLABS_URL || '' }}
        run: pnpm run build:cloudflare

      - name: Deploy Worker + Container + Static Assets to Cloudflare
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # Secret put, deploy edilmemiş version varken fail oluyor — önce deploy, sonra secret.
      # wrangler secret put zaten yayına alır. versions list'teki rastgele eski
      # kopyayı %100 yapmak DATABASE_URL düşürdü (f24ae171, 503).
      - name: Sync Worker secrets (Neon)
        if: steps.cf.outputs.enabled == 'true' && steps.cf.outputs.sync_secrets == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
          HM_EDITOR_JWT_SECRET: ${{ secrets.HM_EDITOR_JWT_SECRET || '' }}
          AGENTLABS_URL: ${{ secrets.AGENTLABS_URL || '' }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT || vars.S3_ENDPOINT || '' }}
        run: |
          set +e
          LAST_VID=""
          capture_created() {
            vid=$(printf '%s' "$1" | grep -oE 'Created version [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | tail -1 | awk '{print $3}')
            if [ -n "$vid" ]; then LAST_VID="$vid"; fi
          }
          put_secret() {
            out=$(printf '%s' "$2" | pnpm exec wrangler secret put "$1" 2>&1)
            printf '%s\n' "$out"
            if printf '%s' "$out" | grep -qi 'Uploaded secret'; then return 0; fi
            out=$(printf '%s' "$2" | pnpm exec wrangler versions secret put "$1" 2>&1)
            printf '%s\n' "$out"
            capture_created "$out"
          }
          put_secret DATABASE_URL "$DATABASE_URL"
          put_secret SESSION_SECRET "$SESSION_SECRET"
          if [ -n "$HM_EDITOR_JWT_SECRET" ]; then
            put_secret HM_EDITOR_JWT_SECRET "$HM_EDITOR_JWT_SECRET"
          fi
          if [ -n "$AGENTLABS_URL" ]; then
            put_secret AGENTLABS_URL "$AGENTLABS_URL"
          fi
          echo "::notice::GitHub S3_ACCESS_KEY / PUBLIC_BASE / BUCKET Worker'a yazılmıyor — Dashboard secret'ı korunur."
          if [ -n "$S3_ENDPOINT" ]; then
            put_secret S3_ENDPOINT "$S3_ENDPOINT"
          fi
          if [ -n "$LAST_VID" ]; then
            echo "::notice::Yalnızca secret put'un ürettiği $LAST_VID yayına alınıyor."
            pnpm exec wrangler versions deploy "${LAST_VID}@100%" --yes --name haberler \
              || pnpm exec wrangler versions deploy "$LAST_VID" --percentage 100 --yes --name haberler \
              || echo "versions deploy failed for $LAST_VID"
          fi
