# Cloudflare Workers + Containers (API) + Postgres (Hostinger / Neon)
# Secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   DATABASE_URL          (Hostinger: postgresql://…@HOST:32768/… — neon.tech olmamalı)
#   SESSION_SECRET        (min 16 chars)
# Optional: AGENTLABS_URL, HM_EDITOR_JWT_SECRET, ADMIN_MAINTENANCE_SECRET,
#           R2_CF_API_TOKEN (fb9f hesap API token; 16f5 CLOUDFLARE_API_TOKEN değil)
# S3_ENDPOINT secret olarak YAZILMAZ (wrangler.toml [vars] ile çakışır, code 10053).
# Eski "versions secret put S3_ENDPOINT → versions deploy @100%" DATABASE_URL'i
# Neon kopyasına geri alıyordu (run 32356785593, version 5807ec05).
name: Cloudflare Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - "goalgo/artifacts/ahenkpress/**"
      - "goalgo/artifacts/yektube-web/**"
      - "goalgo/artifacts/api-server/**"
      - "goalgo/lib/**"
      - "goalgo/Dockerfile.cloudflare"
      - "goalgo/scripts/copy-yektube-build.mjs"
      - "goalgo/scripts/cloudflare-build.mjs"
      - "goalgo/scripts/write-netlify-redirects.mjs"
      - "goalgo/scripts/generate-public-sitemap.mjs"
      - "goalgo/scripts/resolve-api-origin.mjs"
      - "scripts/cloudflare-root-build.mjs"
      - "scripts/ensure-yektube-cloudflare-assets.mjs"
      - "cloudflare/**"
      - "wrangler.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/cloudflare-production.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: DATABASE_URL
    steps:
      - uses: actions/checkout@v6

      - name: Check Cloudflare + database secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy (CLOUDFLARE_API_TOKEN missing)."
            exit 0
          fi
          # ACCOUNT_ID wrangler.toml / cf-fix ile aynı varsayılan
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ACCOUNT_ID=16f5b996194174624e7969a3658bd2bb" >> "$GITHUB_ENV"
          else
            echo "ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          fi
          if [ -z "$DATABASE_URL" ] || [ -z "$SESSION_SECRET" ]; then
            echo "sync_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::error::DATABASE_URL / SESSION_SECRET yok — Worker hâlâ eski Neon URL ile kalır."
            exit 1
          fi
          rest="${DATABASE_URL#*@}"
          hostport="${rest%%/*}"
          host="${hostport%%:*}"
          port="${hostport##*:}"
          echo "database_host=${host:-none}"
          echo "database_port=${port:-default}"
          case "$host" in
            *neon.tech*)
              echo "::error::GitHub DATABASE_URL hâlâ Neon (neon.tech). Secret değerini Hostinger URL'si yapın."
              exit 1
              ;;
            ""|none)
              echo "::error::DATABASE_URL parse edilemedi (host boş)."
              exit 1
              ;;
          esac
          echo "sync_secrets=true" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.cf.outputs.enabled == 'true'
        with:
          version: 9.15.5

      - name: Set up Docker Buildx (API Container)
        if: steps.cf.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v6
        if: steps.cf.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            goalgo/pnpm-lock.yaml

      - name: Install root deps (wrangler / containers)
        if: steps.cf.outputs.enabled == 'true'
        run: pnpm install

      - name: Build SPA
        if: steps.cf.outputs.enabled == 'true'
        env:
          # Same-origin: boş API_ORIGIN → Worker Container /api
          API_ORIGIN: ""
          NPM_CONFIG_PRODUCTION: "false"
          AGENTLABS_URL: ${{ secrets.AGENTLABS_URL || '' }}
        run: pnpm run build:cloudflare

      - name: Deploy Worker + Container + Static Assets to Cloudflare
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Workers Builds (Dashboard Git) aynı anda çalışırsa CF "internal error" verebiliyor.
          echo "Waiting 20s before wrangler deploy to avoid racing Workers Builds..."
          sleep 20
          attempt=1
          max=6
          while true; do
            if pnpm exec wrangler deploy; then
              exit 0
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::wrangler deploy failed after ${max} attempts"
              exit 1
            fi
            sleep_s=$((attempt * 12))
            echo "wrangler deploy failed (attempt ${attempt}/${max}); Cloudflare API hiccup — retry in ${sleep_s}s"
            sleep "$sleep_s"
            attempt=$((attempt + 1))
          done

      # wrangler secret put production'a yazar. versions secret put yeni bir
      # sürüm üretir; onu @100% yapmak eski Neon DATABASE_URL'i geri getirir
      # (32356785593 → 5807ec05). S3_ENDPOINT wrangler.toml [vars]'ta; secret put
      # 10053 verir ve bu tuzak tetiklenir. S3_ENDPOINT asla secret put edilmez.
      - name: Sync Worker DATABASE_URL
        if: steps.cf.outputs.enabled == 'true' && steps.cf.outputs.sync_secrets == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
          HM_EDITOR_JWT_SECRET: ${{ secrets.HM_EDITOR_JWT_SECRET || '' }}
          AGENTLABS_URL: ${{ secrets.AGENTLABS_URL || '' }}
          R2_CF_API_TOKEN: ${{ secrets.R2_CF_API_TOKEN || '' }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            out=$(printf '%s' "$value" | pnpm exec wrangler secret put "$name" 2>&1) || {
              printf '%s\n' "$out"
              echo "::error::$name wrangler secret put failed"
              return 1
            }
            printf '%s\n' "$out"
            if ! printf '%s' "$out" | grep -qi 'Uploaded secret'; then
              echo "::error::$name production'a yazılmadı (Uploaded secret yok). versions secret put kullanılmıyor."
              return 1
            fi
          }
          put_secret DATABASE_URL "$DATABASE_URL"
          put_secret SESSION_SECRET "$SESSION_SECRET"
          if [ -n "${HM_EDITOR_JWT_SECRET}" ]; then
            put_secret HM_EDITOR_JWT_SECRET "$HM_EDITOR_JWT_SECRET"
          fi
          if [ -n "${AGENTLABS_URL}" ]; then
            put_secret AGENTLABS_URL "$AGENTLABS_URL"
          fi
          if [ -n "${R2_CF_API_TOKEN}" ]; then
            put_secret R2_CF_API_TOKEN "$R2_CF_API_TOKEN"
          fi
          echo "::notice::S3_ENDPOINT Worker secret olarak yazılmıyor (wrangler.toml [vars])."

      - name: Redeploy Worker so Container picks up DATABASE_URL
        if: steps.cf.outputs.enabled == 'true' && steps.cf.outputs.sync_secrets == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Verify live dbProvider is hostinger
        if: steps.cf.outputs.enabled == 'true' && steps.cf.outputs.sync_secrets == 'true'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            body=$(curl -fsS -m 25 "https://ahenk.net.tr/api/healthz" || curl -fsS -m 25 "https://vatanhaber.net/api/healthz" || true)
            provider=$(printf '%s' "$body" | sed -n 's/.*"dbProvider":"\([^"]*\)".*/\1/p' | head -1)
            echo "attempt=$i dbProvider=${provider:-empty}"
            if [ "$provider" = "hostinger" ]; then
              echo "Hostinger Postgres canlı."
              exit 0
            fi
            sleep 15
          done
          echo "::error::ahenk.net.tr/api/healthz hâlâ dbProvider=${provider:-unknown} (hostinger bekleniyor). GitHub DATABASE_URL neon.tech içeriyor olabilir veya Container eski env ile uyuyor."
          printf '%s\n' "$body" | head -c 400
          echo
          exit 1
