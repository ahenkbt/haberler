# Cloudflare Workers + Containers (API) + Postgres (Hostinger / Neon)
# Secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   DATABASE_URL          (Neon: postgresql://…@….neon.tech/neondb (haber) + Hostinger yektube ayrı)
#   SESSION_SECRET        (min 16 chars)
# Optional: AGENTLABS_URL, HM_EDITOR_JWT_SECRET, ADMIN_MAINTENANCE_SECRET,
#           R2_CF_API_TOKEN (fb9f hesap API token; 16f5 CLOUDFLARE_API_TOKEN değil)
# S3_ENDPOINT secret olarak YAZILMAZ (wrangler.toml [vars] ile çakışır, code 10053).
# Eski "versions secret put S3_ENDPOINT → versions deploy @100%" DATABASE_URL'i
# Neon kopyasına geri alıyordu (run 32356785593, version 5807ec05).
name: Cloudflare Production Deploy

on:
  push:
    branches:
      - main
    paths:
      - "goalgo/artifacts/ahenkpress/**"
      - "goalgo/artifacts/yektube-web/**"
      - "goalgo/artifacts/api-server/**"
      - "goalgo/lib/**"
      - "goalgo/Dockerfile.cloudflare"
      - "goalgo/scripts/copy-yektube-build.mjs"
      - "goalgo/scripts/cloudflare-build.mjs"
      - "goalgo/scripts/write-netlify-redirects.mjs"
      - "goalgo/scripts/generate-public-sitemap.mjs"
      - "goalgo/scripts/resolve-api-origin.mjs"
      - "scripts/cloudflare-root-build.mjs"
      - "scripts/ensure-yektube-cloudflare-assets.mjs"
      - "cloudflare/**"
      - "wrangler.toml"
      - "wrangler.yektube.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/cloudflare-production.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: DATABASE_URL
    steps:
      - uses: actions/checkout@v6

      - name: Check Cloudflare + database secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YEKTUBE_DATABASE_URL: ${{ secrets.YEKTUBE_DATABASE_URL || '' }}
          YEKTUBE_DB_READ: ${{ secrets.YEKTUBE_DB_READ || '' }}
          YEKTUBE_DB_WRITE: ${{ secrets.YEKTUBE_DB_WRITE || '' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy (CLOUDFLARE_API_TOKEN missing)."
            exit 0
          fi
          # ACCOUNT_ID wrangler.toml / cf-fix ile aynı varsayılan
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ACCOUNT_ID="16f5b996194174624e7969a3658bd2bb"
          else
            ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID"
          fi
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          status="$(curl -sS --oauth2-bearer "$CLOUDFLARE_API_TOKEN" -o /tmp/cf-containers-me.json -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/containers/me" || true)"
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy: CLOUDFLARE_API_TOKEN does not have Workers Containers access for account $ACCOUNT_ID."
            exit 0
          fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Cloudflare containers preflight failed (HTTP $status) for account $ACCOUNT_ID."
            head -c 400 /tmp/cf-containers-me.json || true
            echo
            exit 1
          fi
          if [ -z "$DATABASE_URL" ] || [ -z "$SESSION_SECRET" ]; then
            echo "sync_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::error::DATABASE_URL / SESSION_SECRET yok — Worker hâlâ eski Neon URL ile kalır."
            exit 1
          fi
          rest="${DATABASE_URL#*@}"
          hostport="${rest%%/*}"
          host="${hostport%%:*}"
          port="${hostport##*:}"
          echo "database_host=${host:-none}"
          echo "database_port=${port:-default}"
          case "$host" in
            ""|none)
              echo "::error::DATABASE_URL parse edilemedi (host boş)."
              exit 1
              ;;
          esac
          echo "sync_secrets=true" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        if: steps.cf.outputs.enabled == 'true'
        with:
          version: 9.15.5

      - name: Set up Docker Buildx (API Container)
        if: steps.cf.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v6
        if: steps.cf.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            goalgo/pnpm-lock.yaml

      - name: Install root deps (wrangler / containers)
        if: steps.cf.outputs.enabled == 'true'
        run: pnpm install

      - name: Build SPA
        if: steps.cf.outputs.enabled == 'true'
        env:
          # Same-origin: boş API_ORIGIN → Worker Container /api
          API_ORIGIN: ""
          NPM_CONFIG_PRODUCTION: "false"
          AGENTLABS_URL: ${{ secrets.AGENTLABS_URL || '' }}
        run: pnpm run build:cloudflare

      - name: Deploy Worker + Container + Static Assets to Cloudflare
        if: steps.cf.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Workers Builds (Dashboard Git) aynı anda çalışırsa CF "internal error" verebiliyor.
          echo "Waiting 20s before wrangler deploy to avoid racing Workers Builds..."
          sleep 20
          attempt=1
          max=6
          while true; do
            if pnpm exec wrangler deploy; then
              exit 0
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::wrangler deploy failed after ${max} attempts"
              exit 1
            fi
            sleep_s=$((attempt * 12))
            echo "wrangler deploy failed (attempt ${attempt}/${max}); Cloudflare API hiccup — retry in ${sleep_s}s"
            sleep "$sleep_s"
            attempt=$((attempt + 1))
          done

      # wrangler secret put production'a yazar. versions secret put yeni bir
      # sürüm üretir; onu @100% yapmak eski Neon DATABASE_URL'i geri getirir
      # (32356785593 → 5807ec05). Canlı zaten Hostinger ise secret put atlanır —
      # "latest version isn't currently deployed" Workers Builds yarışında job'u
      # kırmasın diye. versions deploy @100% KULLANILMAZ.
      - name: Skip secret sync when Hostinger is already live
        id: live_db
        if: steps.cf.outputs.enabled == 'true' && steps.cf.outputs.sync_secrets == 'true'
        run: |
          set -euo pipefail
          echo "Waiting 15s so the just-deployed Worker/Container answers healthz..."
          sleep 15
          UA="Mozilla/5.0 (compatible; Haberler-CI/1.0; +https://github.com/ahenkbt/haberler)"
          provider=""
          for i in 1 2 3 4; do
            body=$(curl -fsS -m 25 -A "$UA" "https://ahenk.net.tr/api/healthz" || curl -fsS -m 25 -A "$UA" "https://vatanhaber.net/api/healthz" || true)
            provider=$(printf '%s' "$body" | sed -n 's/.*"dbProvider":"\([^"]*\)".*/\1/p' | head -1)
            echo "live-check attempt=$i dbProvider=${provider:-empty}"
            if [ "$provider" = "neon" ] || [ "$provider" = "hostinger" ]; then
              break
            fi
            sleep 8
          done
          if [ "$provider" = "neon" ]; then
            echo "skip_secrets=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Canlı dbProvider=neon — DATABASE_URL secret put atlanıyor."
          else
            echo "skip_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dbProvider=${provider:-empty} — Neon DATABASE_URL sync edilecek."
          fi

      - name: Sync Worker DATABASE_URL
        if: steps.cf.outputs.enabled == 'true' && steps.cf.outputs.sync_secrets == 'true' && steps.live_db.outputs.skip_secrets != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YEKTUBE_DATABASE_URL: ${{ secrets.YEKTUBE_DATABASE_URL || '' }}
          YEKTUBE_DB_READ: ${{ secrets.YEKTUBE_DB_READ || '' }}
          YEKTUBE_DB_WRITE: ${{ secrets.YEKTUBE_DB_WRITE || '' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || vars.SESSION_SECRET }}
          HM_EDITOR_JWT_SECRET: ${{ secrets.HM_EDITOR_JWT_SECRET || '' }}
          AGENTLABS_URL: ${{ secrets.AGENTLABS_URL || '' }}
          R2_CF_API_TOKEN: ${{ secrets.R2_CF_API_TOKEN || '' }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            local attempt=1
            local max=4
            while true; do
              out=$(printf '%s' "$value" | pnpm exec wrangler secret put "$name" 2>&1) || true
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qi 'Uploaded secret'; then
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::$name wrangler secret put failed after ${max} attempts"
                return 1
              fi
              echo "$name secret put retry ${attempt}/${max} in $((attempt * 8))s"
              sleep $((attempt * 8))
              attempt=$((attempt + 1))
            done
          }
          put_secret DATABASE_URL "$DATABASE_URL"
          if [ -n "${YEKTUBE_DATABASE_URL:-}" ]; then
            put_secret YEKTUBE_DATABASE_URL "$YEKTUBE_DATABASE_URL"
          fi
          if [ -n "${YEKTUBE_DB_READ:-}" ]; then
            put_secret YEKTUBE_DB_READ "$YEKTUBE_DB_READ"
          fi
          if [ -n "${YEKTUBE_DB_WRITE:-}" ]; then
            put_secret YEKTUBE_DB_WRITE "$YEKTUBE_DB_WRITE"
          fi
          put_secret SESSION_SECRET "$SESSION_SECRET"
          if [ -n "${HM_EDITOR_JWT_SECRET}" ]; then
            put_secret HM_EDITOR_JWT_SECRET "$HM_EDITOR_JWT_SECRET"
          fi
          if [ -n "${AGENTLABS_URL}" ]; then
            put_secret AGENTLABS_URL "$AGENTLABS_URL"
          fi
          if [ -n "${R2_CF_API_TOKEN}" ]; then
            put_secret R2_CF_API_TOKEN "$R2_CF_API_TOKEN"
          fi
          echo "::notice::S3_ENDPOINT Worker secret olarak yazılmıyor (wrangler.toml [vars])."

      - name: Sync YEKTUBE Worker secrets
        continue-on-error: true
        # Neon cutover sonrası DATABASE_URL sync skip olsa bile YEKTUBE_* kaybolmasın
        if: steps.cf.outputs.enabled == 'true' && steps.cf.outputs.sync_secrets == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
          YEKTUBE_DATABASE_URL: ${{ secrets.YEKTUBE_DATABASE_URL || '' }}
          YEKTUBE_DB_READ: ${{ secrets.YEKTUBE_DB_READ || '' }}
          YEKTUBE_DB_WRITE: ${{ secrets.YEKTUBE_DB_WRITE || '' }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            [ -n "$value" ] || return 0
            local attempt=1
            local max=4
            while true; do
              out=$(printf '%s' "$value" | pnpm exec wrangler secret put "$name" 2>&1) || true
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qi 'Uploaded secret'; then
                return 0
              fi
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::$name wrangler secret put failed after ${max} attempts"
                return 1
              fi
              sleep $((attempt * 8))
              attempt=$((attempt + 1))
            done
          }
          if [ -z "${YEKTUBE_DATABASE_URL:-}" ]; then
            echo "::notice::YEKTUBE_DATABASE_URL secret yok — atlandı"
            exit 0
          fi
          put_secret YEKTUBE_DATABASE_URL "$YEKTUBE_DATABASE_URL"
          put_secret YEKTUBE_DB_READ "${YEKTUBE_DB_READ:-yektube}"
          put_secret YEKTUBE_DB_WRITE "${YEKTUBE_DB_WRITE:-yektube}"

      - name: Redeploy Worker so Container picks up DATABASE_URL
        if: steps.cf.outputs.enabled == 'true' && steps.cf.outputs.sync_secrets == 'true' && steps.live_db.outputs.skip_secrets != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Verify live dbProvider is neon (or hostinger)
        if: steps.cf.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (compatible; Haberler-CI/1.0; +https://github.com/ahenkbt/haberler)"
          for i in 1 2 3 4 5 6 7 8; do
            body=$(curl -fsS -m 25 -A "$UA" "https://ahenk.net.tr/api/healthz" || curl -fsS -m 25 -A "$UA" "https://vatanhaber.net/api/healthz" || true)
            provider=$(printf '%s' "$body" | sed -n 's/.*"dbProvider":"\([^"]*\)".*/\1/p' | head -1)
            echo "attempt=$i dbProvider=${provider:-empty}"
            if [ "$provider" = "neon" ]; then
              echo "Neon Postgres canlı."
              exit 0
            fi
            sleep 15
          done
          echo "::error::ahenk.net.tr/api/healthz hâlâ dbProvider=${provider:-unknown} (neon bekleniyor). DATABASE_URL / Container env kontrol edin."
          printf '%s\n' "$body" | head -c 400
          echo
          exit 1

  deploy-yektube:
    name: Deploy Yektube Worker
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && needs.deploy.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - name: Skip without token
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '16f5b996194174624e7969a3658bd2bb' }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping yektube deploy (no CLOUDFLARE_API_TOKEN)"
          else
            status="$(curl -sS --oauth2-bearer "$CLOUDFLARE_API_TOKEN" -o /tmp/cf-yektube-me.json -w "%{http_code}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/me" || true)"
            if [ "$status" = "401" ] || [ "$status" = "403" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Skipping yektube deploy: CLOUDFLARE_API_TOKEN lacks Workers Containers access for account $CLOUDFLARE_ACCOUNT_ID."
            elif [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::warning::Skipping yektube deploy: Cloudflare containers preflight returned HTTP $status for account $CLOUDFLARE_ACCOUNT_ID."
              head -c 300 /tmp/cf-yektube-me.json || true
              echo
            fi
          fi
      - uses: pnpm/action-setup@v6
        if: steps.gate.outputs.skip != 'true'
      - uses: actions/setup-node@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.skip != 'true'
      - name: Install root deps
        if: steps.gate.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build SPA
        if: steps.gate.outputs.skip != 'true'
        working-directory: goalgo
        run: pnpm install --frozen-lockfile && pnpm --filter @workspace/ahenkpress run build
      - name: Deploy yektube wrangler
        if: steps.gate.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "16f5b996194174624e7969a3658bd2bb"
        run: |
          set -euo pipefail
          sleep 15
          pnpm exec wrangler deploy -c wrangler.yektube.toml
      - name: Sync yektube secrets
        if: steps.gate.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          YEKTUBE_DATABASE_URL: ${{ secrets.YEKTUBE_DATABASE_URL || '' }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET || '' }}
        run: |
          set -euo pipefail
          put() { [ -n "${2:-}" ] || return 0; printf '%s' "$2" | pnpm exec wrangler secret put "$1" -c wrangler.yektube.toml; }
          # YEKTUBE_DB_READ/WRITE live in wrangler.yektube.toml [vars] — do not secret-put (10053)
          put YEKTUBE_DATABASE_URL "$YEKTUBE_DATABASE_URL"
          put DATABASE_URL "$YEKTUBE_DATABASE_URL"
          put SESSION_SECRET "$SESSION_SECRET"
