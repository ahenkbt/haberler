# Traefik dynamic config — LIVE on VPS 187.77.84.201 (hostname turkatav)
#
# Install path (file provider watches this dir):
#   /docker/traefik/dynamic/gundemi.yml
# Compose: /docker/traefik/docker-compose.yml
# Container: traefik-traefik-1  (--providers.file.directory=/dynamic --providers.file.watch=true)
#
# Upstream: Yenişafak PHP (:8095) — apex slug gundemi + regionals
#   Docker labels on php-theme-yenisafak → Traefik service name `php-tema`
#   Published host port: 127.0.0.1:8095  (file routers use this URL, matching origin-tth.yml)
#
# After this file is live:
# 1) Worker must NOT catch-all `*.gundemi.org/*` (SPA) — panel/API routes only (#395 merged)
# 2) Apex may keep temporary gundemi.org/* bridge until Host(`gundemi.org`) is confirmed
#
# Rollback: rm /docker/traefik/dynamic/gundemi.yml  (file provider auto-reloads)

http:
  routers:
    gundemi-apex:
      rule: "Host(`gundemi.org`) || Host(`www.gundemi.org`)"
      entryPoints: ["websecure"]
      service: gundemi-php-theme
      tls:
        certResolver: letsencrypt
      priority: 20

    # All regional + future admin-created *.gundemi.org → same Yenişafak PHP
    gundemi-wild:
      rule: "HostRegexp(`^[a-z0-9-]+\\.gundemi\\.org$`) || HostRegexp(`^www\\.[a-z0-9-]+\\.gundemi\\.org$`)"
      entryPoints: ["websecure"]
      service: gundemi-php-theme
      tls:
        certResolver: letsencrypt
      priority: 10

    # Explicit seed hosts (optional if HostRegexp works; kept for older Traefik)
    gundemi-ege:
      rule: "Host(`ege.gundemi.org`) || Host(`www.ege.gundemi.org`)"
      entryPoints: ["websecure"]
      service: gundemi-php-theme
      tls:
        certResolver: letsencrypt
      priority: 30

    gundemi-marmara:
      rule: "Host(`marmara.gundemi.org`) || Host(`www.marmara.gundemi.org`)"
      entryPoints: ["websecure"]
      service: gundemi-php-theme
      tls:
        certResolver: letsencrypt
      priority: 30

    gundemi-karadeniz:
      rule: "Host(`karadeniz.gundemi.org`) || Host(`www.karadeniz.gundemi.org`)"
      entryPoints: ["websecure"]
      service: gundemi-php-theme
      tls:
        certResolver: letsencrypt
      priority: 30

    gundemi-icanadolu:
      rule: "Host(`icanadolu.gundemi.org`) || Host(`www.icanadolu.gundemi.org`)"
      entryPoints: ["websecure"]
      service: gundemi-php-theme
      tls:
        certResolver: letsencrypt
      priority: 30

    gundemi-doguanadolu:
      rule: "Host(`doguanadolu.gundemi.org`) || Host(`www.doguanadolu.gundemi.org`)"
      entryPoints: ["websecure"]
      service: gundemi-php-theme
      tls:
        certResolver: letsencrypt
      priority: 30

    gundemi-guneydogu:
      rule: "Host(`guneydogu.gundemi.org`) || Host(`www.guneydogu.gundemi.org`)"
      entryPoints: ["websecure"]
      service: gundemi-php-theme
      tls:
        certResolver: letsencrypt
      priority: 30

    gundemi-akdeniz:
      rule: "Host(`akdeniz.gundemi.org`) || Host(`www.akdeniz.gundemi.org`)"
      entryPoints: ["websecure"]
      service: gundemi-php-theme
      tls:
        certResolver: letsencrypt
      priority: 30

    gundemi-kibris:
      rule: "Host(`kibris.gundemi.org`) || Host(`www.kibris.gundemi.org`)"
      entryPoints: ["websecure"]
      service: gundemi-php-theme
      tls:
        certResolver: letsencrypt
      priority: 30

  services:
    gundemi-php-theme:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://127.0.0.1:8095"
