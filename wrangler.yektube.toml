# Yektube isolated Worker — yektube.com only (haber/HM on wrangler.toml)
name = "yektube"
compatibility_date = "2025-07-15"
main = "cloudflare/worker.js"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "16f5b996194174624e7969a3658bd2bb"

[observability]
enabled = true

[assets]
directory = "artifacts/ahenkpress/dist/public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
API_ORIGIN = "https://ahenk.net.tr"
SITE_PUBLIC_ORIGIN = "https://yektube.com"
CONTAINER_ROLL = "yektube-api-via-ahenk-20260912"
# HM_EDGE_BRIDGE_SECRET removed 2026-10-08: bridge key is the Worker secret HM_EDGE_BRIDGE_KEY (rotated; never in this file).
S3_ENDPOINT = "https://fb9fc9dc1991b7cc17ba58ab3c2e8726.r2.cloudflarestorage.com"
R2_ENDPOINT = "https://fb9fc9dc1991b7cc17ba58ab3c2e8726.r2.cloudflarestorage.com"
S3_BUCKET = "yekpare-media"
S3_REGION = "auto"
S3_FORCE_PATH_STYLE = "true"
R2_ACCOUNT_ID = "fb9fc9dc1991b7cc17ba58ab3c2e8726"
S3_PUBLIC_BASE_URL = "https://pub-c13f0f77c2d140cb89cd2e9b5af2c87e.r2.dev"
YEKTUBE_DB_READ = "yektube"
YEKTUBE_DB_WRITE = "yektube"

# Konteyner yok (2026-10-10). /api, API_ORIGIN üzerinden haberler Worker'ına gider
# (cloudflare/api-upstream.js: dolu API_ORIGIN, GOALGO_API'den önce kullanılır).
# Ayrı standard-3 (8 GiB) instance, uyandırılırsa haberler ile aynı GiB-sn fiyatını yazıyordu.
# Site: bu Worker'ın Assets + worker.js. SPA ve /api yolu durur; yerel Container kalkmaz.
# Geri almak için [[containers]] + GOALGO_API binding ekleyin. instance_type en fazla
# basic, max_instances = 1, ve CONTAINER_ROLL adını DEĞİŞTİRMEYİN (eski ad slot tutar).
# Uygulanmış migration etiketleri silinmez; sınıf hâlâ worker.js'ten export edilir.

[[migrations]]
tag = "v1"
new_sqlite_classes = ["YektubeApiContainer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["GoalgoApiContainer"]

[[routes]]
pattern = "yektube.com"
custom_domain = true

[[routes]]
pattern = "www.yektube.com"
custom_domain = true

[[routes]]
pattern = "yektube.com/*"
zone_name = "yektube.com"

[[routes]]
pattern = "www.yektube.com/*"
zone_name = "yektube.com"
