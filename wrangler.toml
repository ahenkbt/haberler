# Su Haber Ajansı — zone Cloudflare'de; A/AAAA boş → Worker custom_domain
[[routes]]
pattern = "suhaberajansi.com"
custom_domain = true

[[routes]]
pattern = "www.suhaberajansi.com"
custom_domain = true

[[routes]]
