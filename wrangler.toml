# SPA: Workers Static Assets ┬À /api ÔåÆ Cloudflare Container (Neon + R2)
# Workers Builds / cloudflare-production: build SPA ÔåÆ wrangler deploy
name = "haberler"
compatibility_date = "2025-07-15"
main = "cloudflare/worker.js"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "16f5b996194174624e7969a3658bd2bb"

[observability]
enabled = true

[triggers]
crons = ["*/4 * * * *"]

[assets]
directory = "artifacts/ahenkpress/dist/public"
binding = "ASSETS"
# none: /yektube-v2/index.html dosyay─▒ 307'siz servis etsin (auto-trailing-slash
# nested SPA'y─▒ k├Âk portal index.html'e d├╝┼ş├╝r├╝yordu).
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
# Bo┼ş = ayn─▒ origin /api ÔåÆ Container. onrender.com kullan─▒lmaz.
API_ORIGIN = ""
# Warm container'─▒ yeni imaja almak i├ğin (Ahenk marka + ayarlar).
CONTAINER_ROLL = "hm-yektube-secrets-20260912f"
# KH kenar login ÔåÆ API JWT k├Âpr├╝s├╝ (api-server HM_EDGE_BRIDGE_SECRET ile ayn─▒)
HM_EDGE_BRIDGE_SECRET = "yekpare-hm-kh-bridge-20260727-v1"
# Medya: Worker hesab─▒nda R2 kapal─▒ (API 10042). Binding, Dashboard'da R2 a├ğ─▒l─▒nca eklenir.
# Kapaklar Render dual-write R2 hesab─▒nda (fb9fÔÇĞ), wrangler account_id (16f5ÔÇĞ) de─şil.
# GitHub S3_ENDPOINT yap─▒┼şt─▒rmas─▒ (~362 karakter) secret olarak ezerdi; workflow
# art─▒k GitHub secret'─▒n─▒ yazmaz, kanonik fb9f hostunu put eder.
S3_ENDPOINT = "https://fb9fc9dc1991b7cc17ba58ab3c2e8726.r2.cloudflarestorage.com"
R2_ENDPOINT = "https://fb9fc9dc1991b7cc17ba58ab3c2e8726.r2.cloudflarestorage.com"
S3_BUCKET = "yekpare-media"
S3_REGION = "auto"
S3_FORCE_PATH_STYLE = "true"
# R2 REST (api.cloudflare.com) ÔÇö Dashboard secret R2_CF_API_TOKEN. Git'e yaz─▒lmaz.
R2_ACCOUNT_ID = "fb9fc9dc1991b7cc17ba58ab3c2e8726"
# Bucket Settings ÔåÆ Public development URL (nesne yoksa 404; S3_ENDPOINT'e /yekpare-media eklenmez).
S3_PUBLIC_BASE_URL = "https://pub-c13f0f77c2d140cb89cd2e9b5af2c87e.r2.dev"

[[containers]]
class_name = "GoalgoApiContainer"
image = "./goalgo/Dockerfile.cloudflare"
max_instances = 3
instance_type = "standard-3"

[[durable_objects.bindings]]
name = "GOALGO_API"
class_name = "GoalgoApiContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GoalgoApiContainer"]

# yekpare.net / turk.eco / suhaberajansi.com bu worker'dan kald─▒r─▒ld─▒.
# Tekrar ba─şlanmas─▒n diye scripts/cf-detached-domains.mjs her DNS/cutover ├ğal─▒┼şt─▒rmas─▒nda s├Âker.

# Ana portal ÔÇö zone DNS kayd─▒ bo┼ş (A/AAAA yok ÔåÆ taray─▒c─▒ NXDOMAIN).
# custom_domain Worker hostname + anycast A kayd─▒ olu┼şturur; zone_name/* trafi─şi kar┼ş─▒lar.
# DNS kayd─▒ varken custom_domain 100117 verir; ┼şu an kay─▒t yok.
[[routes]]
pattern = "ahenk.net.tr"
custom_domain = true

[[routes]]
pattern = "www.ahenk.net.tr"
custom_domain = true

[[routes]]
pattern = "ahenk.net.tr/*"
zone_name = "ahenk.net.tr"

[[routes]]
pattern = "www.ahenk.net.tr/*"
zone_name = "ahenk.net.tr"

