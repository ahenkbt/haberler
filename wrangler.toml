# SPA: Workers Static Assets · /api → Cloudflare Container (Neon + R2)
# Workers Builds / cloudflare-production: build SPA → wrangler deploy
name = "haberler"
compatibility_date = "2025-07-15"
main = "cloudflare/worker.js"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "16f5b996194174624e7969a3658bd2bb"

[assets]
directory = "artifacts/ahenkpress/dist/public"
binding = "ASSETS"
# none: /yektube-v2/index.html dosyayı 307'siz servis etsin (auto-trailing-slash
# nested SPA'yı kök portal index.html'e düşürüyordu).
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
# Boş = aynı origin /api → Container. onrender.com kullanılmaz.
API_ORIGIN = ""
# KH kenar login → API JWT köprüsü (api-server HM_EDGE_BRIDGE_SECRET ile aynı)
HM_EDGE_BRIDGE_SECRET = "yekpare-hm-kh-bridge-20260727-v1"
# Medya: Worker hesabında R2 kapalı (API 10042). Binding, Dashboard'da R2 açılınca eklenir.
# Kapaklar Render dual-write R2 hesabında (fb9f…), wrangler account_id (16f5…) değil.
# GitHub S3_ENDPOINT yapıştırması (~362 karakter) secret olarak ezerdi; workflow
# artık GitHub secret'ını yazmaz, kanonik fb9f hostunu put eder.
S3_ENDPOINT = "https://fb9fc9dc1991b7cc17ba58ab3c2e8726.r2.cloudflarestorage.com"
R2_ENDPOINT = "https://fb9fc9dc1991b7cc17ba58ab3c2e8726.r2.cloudflarestorage.com"
S3_BUCKET = "yekpare-media"
S3_REGION = "auto"
S3_FORCE_PATH_STYLE = "true"
# R2 REST (api.cloudflare.com) — Dashboard secret R2_CF_API_TOKEN. Git'e yazılmaz.
R2_ACCOUNT_ID = "fb9fc9dc1991b7cc17ba58ab3c2e8726"
# Bucket Settings → Public development URL (nesne yoksa 404; S3_ENDPOINT'e /yekpare-media eklenmez).
S3_PUBLIC_BASE_URL = "https://pub-c13f0f77c2d140cb89cd2e9b5af2c87e.r2.dev"

[[containers]]
class_name = "GoalgoApiContainer"
image = "./goalgo/Dockerfile.cloudflare"
max_instances = 2
instance_type = "standard-1"

[[durable_objects.bindings]]
name = "GOALGO_API"
class_name = "GoalgoApiContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GoalgoApiContainer"]

# yekpare.net / turk.eco / suhaberajansi.com bu worker'dan kaldırıldı.
# Tekrar bağlanmasın diye scripts/cf-detached-domains.mjs her DNS/cutover çalıştırmasında söker.

# Ana portal — zone DNS kaydı boş (A/AAAA yok → tarayıcı NXDOMAIN).
# custom_domain Worker hostname + anycast A kaydı oluşturur; zone_name/* trafiği karşılar.
# DNS kaydı varken custom_domain 100117 verir; şu an kayıt yok.
[[routes]]
pattern = "ahenk.net.tr"
custom_domain = true

[[routes]]
pattern = "www.ahenk.net.tr"
custom_domain = true

[[routes]]
pattern = "ahenk.net.tr/*"
zone_name = "ahenk.net.tr"

[[routes]]
pattern = "www.ahenk.net.tr/*"
zone_name = "ahenk.net.tr"

# HM editör siteleri (Cloudflare zone → Worker → Container / Neon)
[[routes]]
pattern = "ankarahabergundemi.com/*"
zone_name = "ankarahabergundemi.com"

[[routes]]
pattern = "ankarahabergundemi.com"
zone_name = "ankarahabergundemi.com"

[[routes]]
pattern = "www.ankarahabergundemi.com/*"
zone_name = "ankarahabergundemi.com"

[[routes]]
pattern = "www.ankarahabergundemi.com"
zone_name = "ankarahabergundemi.com"

# Yektube özel alan — ahenk.net.tr/yp kanonik yüzü (yektube.com)
[[routes]]
pattern = "yektube.com"
custom_domain = true

[[routes]]
pattern = "www.yektube.com"
custom_domain = true

[[routes]]
pattern = "yektube.com/*"
zone_name = "yektube.com"

[[routes]]
pattern = "www.yektube.com/*"
zone_name = "yektube.com"

# Error 1016: zone aktif ama origin yok — custom_domain Worker DNS oluşturur
[[routes]]
pattern = "ankarasehirgazetesi.com"
custom_domain = true

[[routes]]
pattern = "www.ankarasehirgazetesi.com"
custom_domain = true

[[routes]]
pattern = "ankarasehirgazetesi.com/*"
zone_name = "ankarasehirgazetesi.com"

[[routes]]
pattern = "www.ankarasehirgazetesi.com/*"
zone_name = "ankarasehirgazetesi.com"

[[routes]]
pattern = "vatankahramanlari.org/*"
zone_name = "vatankahramanlari.org"

[[routes]]
pattern = "vatankahramanlari.org"
zone_name = "vatankahramanlari.org"

[[routes]]
pattern = "www.vatankahramanlari.org/*"
zone_name = "vatankahramanlari.org"

[[routes]]
pattern = "www.vatankahramanlari.org"
zone_name = "vatankahramanlari.org"

[[routes]]
pattern = "vatanhaber.net/*"
zone_name = "vatanhaber.net"

[[routes]]
pattern = "vatanhaber.net"
zone_name = "vatanhaber.net"

[[routes]]
pattern = "www.vatanhaber.net/*"
zone_name = "vatanhaber.net"

[[routes]]
pattern = "www.vatanhaber.net"
zone_name = "vatanhaber.net"

# Su Haber — kanonik Google alanı suhaber.net (suhaberajansi.com iptal, detach).
# Zone CF'de ve A/CNAME kayıtları var: custom_domain 100117 ile wrangler deploy kırılır.
# vatanhaber.net gibi zone_name Worker route kullan (DNS'e dokunma).
[[routes]]
pattern = "suhaber.net/*"
zone_name = "suhaber.net"

[[routes]]
pattern = "suhaber.net"
zone_name = "suhaber.net"

[[routes]]
pattern = "www.suhaber.net/*"
zone_name = "suhaber.net"

[[routes]]
pattern = "www.suhaber.net"
zone_name = "suhaber.net"

# suhaberajansi.com iptal — Worker route yok (cf-detached-domains). Kanonik: suhaber.net (/tr/su)
# belediyehizmet.com kaldırıldı.

# Kırşehir Haber (/tr/kh)
# kirsehirhaber.org: zone CF'de (NS hazır) — Worker routes + originless DNS açık.
# kirsehri.com / kirsehir.net: zone yoksa deploy kırılır; DNS gelince açılır.
[[routes]]
pattern = "kirsehirhaber.org"
custom_domain = true

[[routes]]
pattern = "www.kirsehirhaber.org"
custom_domain = true

[[routes]]
pattern = "kirsehirhaber.org/*"
zone_name = "kirsehirhaber.org"

[[routes]]
pattern = "www.kirsehirhaber.org/*"
zone_name = "kirsehirhaber.org"

