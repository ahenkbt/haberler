# SPA: Workers Static Assets Ôö¼├Ç /api ├ö├Ñ├å Cloudflare Container (Neon + R2)
# Workers Builds / cloudflare-production: build SPA ├ö├Ñ├å wrangler deploy
name = "haberler"
compatibility_date = "2025-07-15"
main = "cloudflare/worker.js"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
account_id = "16f5b996194174624e7969a3658bd2bb"

[observability]
enabled = true

[triggers]
crons = ["*/4 * * * *"]

[assets]
directory = "artifacts/ahenkpress/dist/public"
binding = "ASSETS"
# none: /yektube-v2/index.html dosyayÔöÇÔûÆ 307'siz servis etsin (auto-trailing-slash
# nested SPA'yÔöÇÔûÆ kÔö£├ék portal index.html'e dÔö£ÔòØÔö╝┼şÔö£ÔòØrÔö£ÔòØyordu).
html_handling = "none"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
# BoÔö╝┼ş = aynÔöÇÔûÆ origin /api ├ö├Ñ├å Container. onrender.com kullanÔöÇÔûÆlmaz.
API_ORIGIN = ""
# Warm container'ÔöÇÔûÆ yeni imaja almak iÔö£─şin (Ahenk marka + ayarlar).
CONTAINER_ROLL = "panel-site-update-wake-20261007"
# KH kenar login ├ö├Ñ├å API JWT kÔö£├éprÔö£ÔòØsÔö£ÔòØ (api-server HM_EDGE_BRIDGE_SECRET ile aynÔöÇÔûÆ)
HM_EDGE_BRIDGE_SECRET = "yekpare-hm-kh-bridge-20260727-v1"
# Medya: Worker hesabÔöÇÔûÆnda R2 kapalÔöÇÔûÆ (API 10042). Binding, Dashboard'da R2 aÔö£─şÔöÇÔûÆlÔöÇÔûÆnca eklenir.
# Kapaklar Render dual-write R2 hesabÔöÇÔûÆnda (fb9f├ö├ç─Ş), wrangler account_id (16f5├ö├ç─Ş) deÔöÇ┼şil.
# GitHub S3_ENDPOINT yapÔöÇÔûÆÔö╝┼ştÔöÇÔûÆrmasÔöÇÔûÆ (~362 karakter) secret olarak ezerdi; workflow
# artÔöÇÔûÆk GitHub secret'ÔöÇÔûÆnÔöÇÔûÆ yazmaz, kanonik fb9f hostunu put eder.
S3_ENDPOINT = "https://fb9fc9dc1991b7cc17ba58ab3c2e8726.r2.cloudflarestorage.com"
R2_ENDPOINT = "https://fb9fc9dc1991b7cc17ba58ab3c2e8726.r2.cloudflarestorage.com"
S3_BUCKET = "yekpare-media"
S3_REGION = "auto"
S3_FORCE_PATH_STYLE = "true"
# R2 REST (api.cloudflare.com) ├ö├ç├Â Dashboard secret R2_CF_API_TOKEN. Git'e yazÔöÇÔûÆlmaz.
R2_ACCOUNT_ID = "fb9fc9dc1991b7cc17ba58ab3c2e8726"
# Bucket Settings ├ö├Ñ├å Public development URL (nesne yoksa 404; S3_ENDPOINT'e /yekpare-media eklenmez).
S3_PUBLIC_BASE_URL = "https://pub-c13f0f77c2d140cb89cd2e9b5af2c87e.r2.dev"

[[containers]]
class_name = "GoalgoApiContainer"
image = "./goalgo/Dockerfile.cloudflare"
max_instances = 3
instance_type = "standard-3"

[[durable_objects.bindings]]
name = "GOALGO_API"
class_name = "GoalgoApiContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GoalgoApiContainer"]

